[build-system]
requires = ["uv_build >= 0.10.10, <0.12.0"]
build-backend = "uv_build"

[project]
name = "equiformer_v3"
version = "0.0.2"
description = "Equiformer v3"
readme = "README.md"
requires-python = ">=3.11"
dynamic = []

dependencies = [
    "ase>=3.22,<4.0",
    "numpy>=1.26,<3.0",
    "myplots>=0.1.1",
    "fairchem-core",
    "torch==2.4.1",
    "scipy<1.12",
    "torchvision",
    "torchaudio",
    "torch_geometric",
    "torch-scatter==2.1.2+pt24cu121",
    "torch-sparse==0.6.18+pt24cu121",
    "torch-cluster==1.6.3+pt24cu121",
    "torch-spline-conv==1.2.2+pt24cu121",
]

[tool.uv.extra-build-dependencies]
torch-sparse = ["torch==2.4.1","setuptools"]
torch-scatter = ["torch==2.4.1","setuptools"]
torch-cluster = ["torch==2.4.1","setuptools"]
torch-spline-conv = ["torch==2.4.1","setuptools"]

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-2.4.1+cu121.html"]

[tool.uv.build-backend]
source-include = ["src"]
exclude = ["src/equiformer_v3/experimental"]

# UV build
[tool.uv_build]
include = ["fairchem/**/*.pyi", "fairchem/py.typed"]

[project.urls]
Repository = "https://github.com/daniisler/equiformer_v3/tree/feature-python-package"
